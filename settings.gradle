pluginManagement {
    repositories {
        // v1.3.92: dl.google.com FIRST — the sandbox's fastest, most reliable
        // repo (verified 200 @ 60ms while aliyun 502'd and mavenCentral 429'd
        // on the same artifact in the same minute). Repo order matters more
        // than it looks: Gradle DISABLES a repository for the whole build on
        // a hard error (502), so a dead mirror listed first poisons every
        // resolution even when the official repo would serve the artifact.
        // aliyun stays as a fallback (it has carried whole sessions when the
        // official repos were the rate-limited ones — v1.3.31's lesson, now
        // symmetric): the environment flips which repo is healthy, the
        // fallback chain serves either way.
        // v1.4.29 (2026-11-24): the health flip struck the PLUGIN classpath —
        // repo.maven.apache.org 429'd every HEAD (hundreds of plugin-dep
        // probes = minutes of dead latency per configuration) while aliyun
        // carried the artifacts, so the aliyun mirrors move ABOVE
        // mavenCentral here (exactly the v1.4.23 dependency block's
        // adaptation, now applied to pluginManagement; google() stays above
        // the aliyun GOOGLE mirror for the Android artifacts it serves
        // authoritatively). The chain is unchanged; only the order follows
        // the environment.
        google()
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositories {
        // v1.4.23: aliyun FIRST for dependencies — repo.maven.apache.org is
        // 429ing this sandbox hard right now and Gradle treats a 429 as a
        // repository-level failure (the fallback chain never reaches the
        // healthy mirror). The v1.3.31 lesson, symmetric: the environment
        // flips which repo is healthy; the chain serves either way.
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
    }
}
rootProject.name = "Bolt"
include ':app'
