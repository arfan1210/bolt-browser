plugins {
    id 'com.android.application'
    // v1.3.20: Kotlin (WebAuthnHelper.kt — passkey/WebAuthn engine toggle)
    id 'org.jetbrains.kotlin.android'
}

// public migration: flipped true inside signingConfigs when release creds are
// found — drives the debug buildType's fallback to the standard debug key.
def boltHasCreds = false

android {
    namespace 'com.bolt.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.bolt.browser"
        minSdk 24
        targetSdk 34
        // v1.4.17 (2026-11-18): the polish seven-pack — the span-void law
        // (move-to-group), the group-sheet active highlight + the rim inset
        // law, the visual-search fidelity pass, the commit-time dark pass +
        // the dark canvas (the white-flash fix), the AI raw-response
        // evidence channel, the Material Symbols pass, the incognito search
        // face.
        // v1.4.18 (2026-11-19): the field-cure six-pack — the drag-door
        // no-void reload (posted relayout), the omnibox focus law (actions
        // row + empty-field copy), the dark commit-invert-first pass (the
        // ask-first hold retired) + background-tab fix, the visual-search
        // session continuity (cookie/UA jar law + Bing base href), the AI
        // chain law (custom models keep fallbacks, 5xx advances, 503
        // ladder), the session-aware external search (forward + widget).
        // v1.4.20 (2026-11-20): the evidence-pack — the API-29 artwork
        // cap (the media-notification process kill), the forced-dark icon
        // + thickness floor, the translate thinking-off + tile road, the
        // single-route image search (Google for every engine, the Bing SBI
        // retired), the ask-every-time download door, the downloads.json
        // payload drop, the official engine marks, the Markdown+LaTeX
        // chat rendering.
        // v1.4.21 (2026-11-20): the corpse-map six-pack — the per-channel
        // artwork copies + the API-29 artwork-off default (the shared-
        // instance recycle kill), the back-history survival across tab
        // sleep/cold start, the translate 400 ladder-down + proactive 2x2
        // tiling + the translate-model picker, the forced-dark IMG/bg-icon
        // classifier, the DDG two-color mark + the engine-logo binding
        // breadcrumb, the AI formatting completion (strikethrough, styled
        // tables, syntax colors, jlatexmath matrices).
        // v1.4.23 (2026-11-20) — THE CRITICAL REBUILD: this version is a
        // FRESH re-implementation of the four v1.4.22 fixes on the clean
        // v1.4.21 source (the v1.4.22 decompile-port crashed on launch —
        // see README, THE LAUNCH LAW): the forced-dark DEFAULT-FLIP round
        // (small media rides the page inversion by default; the uiCtx
        // guessing retired; the raiseCss font-icon lift; the bounded
        // canvas/SVG contrast rescue; the per-page census Diag), the
        // engine-logo RASTER TURN (five official 64x64 PNGs in
        // drawable-nodpi, offline-reproducible; the home search pill + the
        // icon-row picker + the homeGen follow at both engine-selection
        // entry points), the screen-translate HYBRID (on-device OCR for
        // accurate text + boxes, ONE pure-text numbered-lines request with
        // full context, the vision path demoted to a genuine-cut/OCR-blind
        // fallback with the transcript as tile context), and the AiRender
        // FOUR-PACK (HTML mark/u/del/sub/sup/b/i/code/br/a span stack,
        // nested quote bars, tappable task checkboxes, footnotes + ins).
        // THE LAUNCH LAW rides below too: the release pipeline now runs a
        // real launch smoke test (Robolectric: Application.onCreate -> the
        // launcher activity -> buildHomeView) before any publish.
        // v1.4.24 (2026-11-21) — THE CORPSE-FIX + SIZE ROUND: the
        // stale-snapshot navigation kill (clearHist on every explicit
        // new navigation; restoreHist's URL guard; the warm-restore
        // consume — an old page can never resurrect over a new one),
        // the OCR source-language law (the hardcoded chi_sim+jpn+eng
        // default dies; a picker spanning the app's own language list,
        // default eng; the low-yield vision fallback), THE FONT-PACK
        // SPLIT (jlatexmath's 30 TTFs, 455,768 B, out of the APK and into
        // an on-demand download on first math render — the tesseract
        // pattern; target ~2.8-2.9 MB), and the dark classifier's
        // monochrome-glyph law (small MONOCHROME media inverts even
        // inside photo context; the census counts mono now).
        // v1.4.25 (2026-11-21) — THE RELIABILITY + COVERAGE ROUND: THE
        // CORE-FONT REBUY (the 7 core math fonts back IN the APK —
        // fractions/matrices/greek/AMS work offline & on metered data;
        // the 23 optional fonts stay on-demand with the RETRY law + the
        // manual Math-fonts chip + live status), the AiRender COLOUR law
        // (span/font color -> ForegroundColorSpan, safely parsed hex/rgb/
        // named; the code colorizer verified multi-color), THE SCREEN-
        // TRANSLATE GRID (2x3 cells, per-tile native-resolution OCR,
        // per-tile text-only vision for under-read cells — coverage is
        // geometric, box_2d never trusted again), THE PER-FRAME PASSWORD
        // FILL (the FrameHooks relay routes the fill to the frame that
        // holds the login field — the cross-origin SSO iframe case —
        // native value setters + input/change events, the outcome
        // toasted/Diag'd, never silent), and the dark FONT-ICON RIDE +
        // LIGHT law (icon-font glyphs ride the inversion, never the
        // faint mid-gray; pinned dark/mid lifts to the visible light;
        // the census counts fi).
        // v1.4.26 (2026-11-21) — the black-on-black + bubble round: the
        // ancestor icon signal, the deferred re-evaluation race killer,
        // the contrast-aware preserve + target (the 153-clamp corpse),
        // the bubble-aware manga scripts, the GFM wrapper traversal + the
        // ~sub~/^sup^ delimiters, the QR buffer pin + the stylized
        // decode passes.
        // v1.4.27 (2026-11-22) — the picture-stack + merged-pipeline round:
        // the nested-media exemption (the TBS picture corpse) + the
        // remote-img/banner thumbnail laws, the ONE content-aware
        // translate pipeline (cluster cards + the shared textTranslate +
        // the host re-arm — the fails-after-a-few-runs corpse), the
        // real-line table span, the robust QR gallery ladder + the
        // preview-transform fill assertion.
        versionCode 141
        versionName "1.4.27"
        // v1.3.73 — THE SIZE LAW (user-set): the base APK must stay super
        // light (≤ 5-6 MB). v1.3.72 shipped ML Kit's bundled OCR models and
        // hit 23.4 MB — that is out of budget. OCR is now on-demand
        // (tesseract.js in a headless WebView, models fetched once into
        // filesDir), so there is NO native code and NO bundled model left:
        // universal APK, no abiFilters, release.sh hard-fails > 6,000,000 B.
    }

    // v1.3.30: VERSION_CODE gates the persisted concealment latch
    // (one concealment re-test per app version — a WebView update can flip
    // the behavior either way). AGP 8 defaults buildConfig OFF.
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // PUBLIC-SOURCE SIGNING RULES (the public migration): the release
            // signing key NEVER lives in this or any repository. Credentials
            // are read ONLY from a gitignored local.properties:
            //   bolt.storeFile=/abs/path/to/your.keystore
            //   bolt.storePassword=...
            //   bolt.keyAlias=...
            //   bolt.keyPassword=...
            // or env vars BOLT_STORE_FILE / BOLT_STORE_PASSWORD / BOLT_KEY_ALIAS
            // / BOLT_KEY_PASSWORD. When absent: assembleDebug falls back to the
            // standard Android debug key (a fresh clone of this repo builds
            // with zero secret files present); assembleRelease yields an
            // UNSIGNED apk — the release script fails loudly on it, never ship
            // an unsigned build.
            def lp = rootProject.file('local.properties')
            def sp = new Properties()
            if (lp.exists()) { lp.withInputStream { sp.load(it) } }
            def sf = System.getenv('BOLT_STORE_FILE') ?: sp.getProperty('bolt.storeFile')
            def pw = System.getenv('BOLT_STORE_PASSWORD') ?: sp.getProperty('bolt.storePassword')
            def ka = System.getenv('BOLT_KEY_ALIAS') ?: sp.getProperty('bolt.keyAlias')
            def kp = System.getenv('BOLT_KEY_PASSWORD') ?: sp.getProperty('bolt.keyPassword')
            if (pw != null && sf != null && file(sf).exists()) {
                storeFile file(sf)
                storePassword pw
                keyAlias ka
                keyPassword kp
                boltHasCreds = true
            }
        }
    }

    buildTypes {
        release {
            // v1.3.41 (field bug 6): R8 + resource shrinking ON. The 1.3.40
            // APK was 4.85 MB with classes.dex at 2.94 MB compressed (61%,
            // zero shrinking since v1.0). Keep rules for the WebView JS
            // bridge and crash line numbers live in proguard-rules.pro —
            // follow the "R8 verification" steps in README after any change.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // creds present -> same key as releases (debug installs update
            // over release installs); absent -> the standard Android debug
            // key, so a fresh public clone assemblesDebug with zero secret
            // files present
            signingConfig (boltHasCreds ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // v1.3.20: Kotlin jvm target must match the Java compile target above
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    // v1.4.23 — THE LAUNCH LAW (the v1.4.22 decompile-port corpse): the
    // unit-test source set is REAL now — Robolectric drives the actual
    // Application.onCreate through the launcher activity into the first
    // home render before any release publishes (see LaunchSmokeTest and
    // scripts/release.sh's launch-smoke rung).
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        // v1.4.26 — THE PERSISTENT ROBOLECTRIC CACHE: the android-all jar
        // (~150 MB, org.robolectric:android-all-instrumented) is fetched
        // ONCE into a machine-local MAVEN LAYOUT that SURVIVES sandbox
        // recycles (the default ~/.m2 / ~/.robolectric live outside the
        // persisted project tree, and mavenCentral 429s this environment —
        // the Aliyun mirror fetches it into maven.repo.local). The dir is
        // machine-local config: only applied when it exists, never
        // committed.
        def roboDir = new File('/home/z/my-project/robolectric-deps')
        if (roboDir.isDirectory()) {
            unitTests.all {
                systemProperty 'maven.repo.local', roboDir.getAbsolutePath()
                systemProperty 'robolectric.dependency.repo.dir', roboDir.getAbsolutePath()
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // v1.3.92: the home shortcut matrix — 6x7 pages swiped horizontally
    // (the v1.3.91 field spec). Pure pager: no fragments, no material,
    // recyclerview is already a dependency (~60 KB of dex).
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.annotation:annotation:1.8.0'
    // v1.3.20: WebAuthn/passkeys in WebView — setWebAuthenticationSupport(
    // WEB_AUTHENTICATION_SUPPORT_FOR_BROWSER). 1.12.0 is the API floor; every
    // newer stable works.
    implementation 'androidx.webkit:webkit:1.14.0'
    // v1.3.32: QR decode/encode for the authenticator's Google-transfer
    // flow (screenshot import + per-account export QR). Pure-Java core
    // module only — no camera, no Activity, ~500 KB.
    implementation 'com.google.zxing:core:3.5.3'
    // v1.4.20: MARKDOWN IN BOLT AI — commonmark-java core + the GFM tables
    // extension are the parser behind AiRender.kt (chat replies render as
    // native Spanned, never a WebView). Pure Java, zero fonts, zero
    // resources — ~130 KB of class files before R8 tree-shakes the
    // untouched half.
    // v1.4.21: the GFM STRIKETHROUGH extension joins (~~text~~), and the
    // LaTeX half upgrades from the hand-rolled span subset to FULL TeX via
    // jlatexmath-android (matrices/pmatrix/bmatrix, cases, align — the
    // user's explicit ask). The old "no heavy font packs" concern is
    // settled by the budget gate itself: the AAR's ~1.1 MB of assets +
    // kept classes keep the APK near 3.8 MB, well under the 6 MB law;
    // the lib inits LAZILY (its auto-init provider is removed from the
    // merged manifest — a browser start never pays for chat math) and the
    // v1.4.20 span subset remains the fallback for formulas it cannot
    // shape. NOTE the artifact ids: the GFM extensions ride
    // commonmark-ext-gfm-<name> (plain -ext-<name> does not exist);
    // jlatexmath-android is GPL-2.0 + linking exception (THIRDPARTY.md).
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0'
    // v1.4.23: THE FOUR-PACK — task-list items (tappable [x] checkboxes),
    // footnotes (superscript refs + the appended trailer), and ins
    // (<ins> == underline == ++text++) join the markdown set behind
    // AiRender.kt. Same plain -ext-<name> artifact family as the GFM pair,
    // BSD-2 pure Java, and R8 tree-shakes them to the node classes the
    // visitor walks (the three together are ~25 KB of class files).
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.24.0'
    implementation 'org.commonmark:commonmark-ext-footnotes:0.24.0'
    implementation 'org.commonmark:commonmark-ext-ins:0.24.0'
    // v1.4.23 — THE LAUNCH LAW runtime: Robolectric gives the unit tests a
    // real instrumented Android framework so the launch smoke can drive
    // Application -> launcher activity -> buildHomeView for real.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'junit:junit:4.13.2'
    // v1.4.24 — THE FONT-PACK SPLIT (the size law, take two; the user
    // asked twice): the maven AAR is REPLACED by the THIN AAR checked in
    // at app/libs/jlatexmath-thin.aar (scripts/thin_jlatexmath.py builds
    // it from the pinned upstream ru.noties:jlatexmath-android:0.2.0 —
    // same engine classes, same XML descriptors, MINUS the 30 bundled
    // TTF binaries (455,768 B raw — 286,982 B stored-compressed in the
    // v1.4.23 APK; the 287,405 B size reclaim) and MINUS the
    // JLatexMathAndroid seam class, which the app's own source tree
    // re-implements (ru/noties/jlatexmath/JLatexMathAndroid.java) with
    // doors that fall through to the ON-DEMAND pack in filesDir
    // (util/MathFonts.kt, the v1.3.73 tesseract law: download on first
    // math render, metered-skip, span-subset fallback, never a crash).
    // Provenance + byte-identity notes live in THIRDPARTY.md.
    implementation files('libs/jlatexmath-thin.aar')
    // v1.3.73: NO ML Kit — the bundled OCR models cost +20.9 MB of APK
    // (17.8 MB native .so across ARM ABIs + 3.5 MB model assets) and the
    // budget law is ≤ 6 MB. Translate screen now OCRs through tesseract.js
    // 5.1.1 in a headless WebView (assets/scr_ocr.html): the engine +
    // tessdata_fast models download ONCE on demand (pinned jsDelivr
    // URLs, cached in filesDir) and the APK carries only a ~4 KB page.
    // No Google Play Services, works on any WebAssembly-capable WebView.
    // force kotlin-stdlib jdk7/jdk8 variants to match -> avoids duplicate-class errors
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24') { because('align kotlin versions') }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24') { because('align kotlin versions') }
    }
}
